name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Vet
        working-directory: al-language-server-go
        run: go vet ./...

      - name: Test
        working-directory: al-language-server-go
        run: go test ./...

      - name: Build Windows
        working-directory: al-language-server-go
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/al-lsp-wrapper.exe .

      - name: Build Linux
        working-directory: al-language-server-go
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/al-lsp-wrapper .

  build-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile
        working-directory: vscode-extension
        run: npm run compile

  # Start the committed plugin binaries (what marketplace users get) and check
  # both backends answer. The AL extension is downloaded from the Marketplace.
  smoke-plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            wrapper: al-language-server-go-windows/bin/al-lsp-wrapper.exe
          - os: ubuntu-latest
            wrapper: al-language-server-go-linux/bin/al-lsp-wrapper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke test
        shell: bash
        run: python test-al-project/smoke_lsp.py "$PWD/${{ matrix.wrapper }}" --launcher claude-code --auto-download-al-extension

  check-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Linux binaries have execute permission
        run: |
          failed=false
          for bin in al-language-server-go-linux/bin/al-call-hierarchy al-language-server-go-linux/bin/al-lsp-wrapper; do
            mode=$(git ls-files -s "$bin" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error::$bin has mode $mode, expected 100755 (execute). Run: git update-index --chmod=+x $bin"
              failed=true
            else
              echo "✓ $bin has correct permissions ($mode)"
            fi
          done
          if [ "$failed" = true ]; then
            exit 1
          fi
